apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dhvani.fullname" . | default "dhvani" }}-backend
  labels:
    app.kubernetes.io/name: dhvani
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dhvani
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dhvani
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379/0"
            - name: DATABASE_URL
              value: "postgresql://dhvani_admin@{{ .Release.Name }}-postgresql:5432/dhvani_enterprise"
          envFrom:
            - configMapRef:
                name: {{ include "dhvani.fullname" . | default "dhvani" }}-config
          volumeMounts:
            - name: ephemeral-ram
              mountPath: /app/data/temp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: ephemeral-ram
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
