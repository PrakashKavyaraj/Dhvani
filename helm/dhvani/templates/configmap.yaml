apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dhvani.fullname" . | default "dhvani" }}-config
  labels:
    app.kubernetes.io/name: dhvani
data:
  DEFAULT_TENANT_ID: {{ .Values.backend.env.DEFAULT_TENANT_ID | quote }}
  SLA_BUDGET_MS: {{ .Values.backend.env.SLA_BUDGET_MS | quote }}
  REDIS_SESSION_TTL_SECONDS: {{ .Values.backend.env.REDIS_SESSION_TTL_SECONDS | quote }}
  SECURE_MEMORY_WIPE: {{ .Values.backend.env.SECURE_MEMORY_WIPE | quote }}
  ENABLE_PGVECTOR: {{ .Values.backend.env.ENABLE_PGVECTOR | quote }}
